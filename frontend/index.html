<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3JCEXBMWRB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      // send_page_view: false - AnalyticsTracker.jsx (frontend/src/components)
      // sends every page_view explicitly, including the first one, so the
      // default automatic page_view this config call would otherwise send
      // doesn't double-count the initial load alongside it.
      gtag('config', 'G-3JCEXBMWRB', { send_page_view: false });
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E6F5C" />
    <meta name="description" content="Scan. Select. Split fairly. Smart Bill Split keeps every friend's balances and settlements in sync, in real time." />
    <title>Smart Bill Split</title>
    <script>
      // Applied before any CSS paints, so a stored dark-mode override
      // doesn't flash light-then-dark on load - mirrors ThemeContext's own
      // logic exactly (see frontend/src/context/ThemeContext.jsx), kept in
      // sync manually since this has to run before React (or any module)
      // is available to share the logic from.
      (function () {
        var stored = localStorage.getItem('billsplit_theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
